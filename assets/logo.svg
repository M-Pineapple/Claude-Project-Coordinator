<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Claude Project Coordinator — multi-project MCP">
  <title>Claude Project Coordinator</title>

  <defs>
    <linearGradient id="window" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="titlebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#243349"/>
      <stop offset="100%" stop-color="#1a2436"/>
    </linearGradient>

    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="accent-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <radialGradient id="travel-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fb923c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Drop shadow -->
  <rect x="22" y="44" width="356" height="316" rx="22" fill="#000" opacity="0.18"/>

  <!-- Terminal window -->
  <rect x="20" y="40" width="360" height="320" rx="22"
        fill="url(#window)" stroke="#334155" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M 20,62 Q 20,40 42,40 L 358,40 Q 380,40 380,62 L 380,82 L 20,82 Z"
        fill="url(#titlebar)" opacity="0.7"/>
  <line x1="20" y1="82" x2="380" y2="82" stroke="#0b1220" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="42" cy="61" r="6" fill="#ef4444"/>
  <circle cx="62" cy="61" r="6" fill="#eab308"/>
  <circle cx="82" cy="61" r="6" fill="#22c55e"/>

  <!-- Title text -->
  <text x="200" y="66" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Monaco, monospace"
        font-size="11" font-weight="600" fill="#64748b">project-coordinator</text>

  <!-- Connecting graph arc above the cards (links the projects together visually) -->
  <path d="M 95,150 Q 200,118 305,150"
        stroke="#fb923c" stroke-width="1.2" fill="none"
        opacity="0.45" stroke-dasharray="2,3"/>

  <!-- Three project cards (centered, 80 wide x 150 tall, gap 24, x_start = 60) -->
  <!-- Card 1 -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="80" height="150" rx="8" fill="url(#card)" stroke="#334155" stroke-width="0.5"/>
    <!-- Accent bar -->
    <rect x="0" y="0" width="80" height="4" rx="2" fill="url(#accent-orange)"/>
    <!-- Project mock content -->
    <text x="10" y="22" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="9" font-weight="600" fill="#cbd5e1">app-core</text>
    <rect x="10" y="32" width="58" height="3" rx="1" fill="#475569"/>
    <rect x="10" y="40" width="44" height="3" rx="1" fill="#475569"/>
    <rect x="10" y="48" width="52" height="3" rx="1" fill="#475569"/>
    <!-- File icon stack -->
    <rect x="10" y="62" width="16" height="20" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <rect x="30" y="62" width="16" height="20" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <rect x="50" y="62" width="16" height="20" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <!-- Status pill -->
    <rect x="10" y="120" width="44" height="14" rx="7" fill="#22c55e" opacity="0.2"/>
    <circle cx="18" cy="127" r="3" fill="#22c55e"/>
    <text x="26" y="131" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="8" font-weight="600" fill="#86efac">active</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(160, 150)">
    <rect x="0" y="0" width="80" height="150" rx="8" fill="url(#card)" stroke="#334155" stroke-width="0.5"/>
    <rect x="0" y="0" width="80" height="4" rx="2" fill="url(#accent-red)"/>
    <text x="10" y="22" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="9" font-weight="600" fill="#cbd5e1">api-server</text>
    <rect x="10" y="32" width="50" height="3" rx="1" fill="#475569"/>
    <rect x="10" y="40" width="58" height="3" rx="1" fill="#475569"/>
    <rect x="10" y="48" width="40" height="3" rx="1" fill="#475569"/>
    <rect x="10" y="62" width="16" height="20" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <rect x="30" y="62" width="16" height="20" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <rect x="50" y="62" width="16" height="20" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <rect x="10" y="120" width="50" height="14" rx="7" fill="#3b82f6" opacity="0.2"/>
    <circle cx="18" cy="127" r="3" fill="#3b82f6"/>
    <text x="26" y="131" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="8" font-weight="600" fill="#93c5fd">in-prog</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(260, 150)">
    <rect x="0" y="0" width="80" height="150" rx="8" fill="url(#card)" stroke="#334155" stroke-width="0.5"/>
    <rect x="0" y="0" width="80" height="4" rx="2" fill="url(#accent-amber)"/>
    <text x="10" y="22" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="9" font-weight="600" fill="#cbd5e1">ui-kit</text>
    <rect x="10" y="32" width="56" height="3" rx="1" fill="#475569"/>
    <rect x="10" y="40" width="38" height="3" rx="1" fill="#475569"/>
    <rect x="10" y="48" width="50" height="3" rx="1" fill="#475569"/>
    <rect x="10" y="62" width="16" height="20" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <rect x="30" y="62" width="16" height="20" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <rect x="50" y="62" width="16" height="20" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <rect x="10" y="120" width="44" height="14" rx="7" fill="#f59e0b" opacity="0.2"/>
    <circle cx="18" cy="127" r="3" fill="#f59e0b"/>
    <text x="26" y="131" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="8" font-weight="600" fill="#fcd34d">paused</text>
  </g>

  <!-- Travelling glow that hovers over each card in turn (above their accent bars).
       Animate cx directly so the static render also positions the glow sensibly
       (over the first card, at rest position). -->
  <circle cx="100" cy="148" r="14" fill="url(#travel-glow)">
    <animate attributeName="cx" values="100;200;300;200;100" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom prompt with pulsing cursor -->
  <g transform="translate(40, 332)">
    <text x="0" y="0" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, monospace"
          font-size="14" font-weight="600" fill="#fb923c">&#x276F;</text>
    <text x="20" y="0" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, monospace"
          font-size="13" font-weight="500" fill="#fef3c7">coordinator</text>
    <rect x="125" y="-12" width="9" height="14" fill="#fef3c7">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
